# 目标包名配置 —— 一行一个包名。
#
#   · '#' 开头为注释，空行忽略
#   · 命中集合里任意一个包名，该进程就会被注入
#   · 默认全是注释 = 不注入任何 App（安全默认，不会拖慢整机）
#
# ⚠️ 改完必须**重启目标 App** 才生效。
#    Zygisk 只在进程 specialize 的那一刻读一次配置（由 root companion 读），
#    已经跑起来的进程不会重新读。改文件对当前进程无效。
#
# ⚠️ 目标 App **不能**在 Magisk 的排除列表（DenyList）里。
#    在 DenyList 里的进程，Magisk 会强制卸载模块挂载、跳过 Zygisk 注入，
#    结果就是"配置写得对，但永远不注入"。
#
# 示例（英雄联盟手游）：
# com.tencent.lolm
