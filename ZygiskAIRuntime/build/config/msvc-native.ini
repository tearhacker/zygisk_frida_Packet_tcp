# Meson native file —— 指定 **build machine**（本机 Windows x86_64）编译器。
#
# 为什么需要它：
#   frida-gum 的 meson.build:404 无条件调用
#     dependency('glib-2.0', native: true)
#   而本机没有 pkg-config / 已安装的 glib，meson 只能回退去编译
#   subprojects/glib 的 build machine 版本 —— 这就必须有本机 C 编译器。
#   没有它 meson setup 会 fatal：
#     ERROR: Tried to access compiler for language "c", not specified for build machine.
#
# 为什么是 cl.exe 而不是别的：
#   本机没有 MinGW / gcc。MSVC 可用，但 **Windows SDK 装在 D 盘**
#   （D:/Windows Kits/10，10.0.26100.0），C 盘的 C:/Program Files (x86)/Windows Kits 是空的，
#   VS 的 vcvarsall.bat 又因 cmd.exe 被沙箱禁用而无法执行，
#   所以 INCLUDE / LIB 必须**手动**拼出来（见 build/config/toolchain.env 的 MSVC 段）。
#
# 用法：
#   source build/config/toolchain.env       # 会 export INCLUDE / LIB
#   meson setup ... --native-file build/config/msvc-native.ini

[binaries]
c = 'D:/ProgramerDevelop/VS2026/SDK/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/cl.exe'
cpp = 'D:/ProgramerDevelop/VS2026/SDK/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/cl.exe'
ar = 'D:/ProgramerDevelop/VS2026/SDK/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/lib.exe'

# c_ld / cpp_ld 必须显式给绝对路径，原因很隐蔽：
#   meson 检测 MSVC 时是 guess_win_linker(env, ['link'], ...)，用的是**裸名** link，
#   靠 PATH 解析。而 Git Bash 的 PATH 里有 GNU coreutils 的 `link`（建硬链接的命令），
#   会先于 MSVC 被命中，于是 meson 拿到
#     "link (GNU coreutils) 8.32"
#   版本解析失败 → 整个 MSVC 编译器被判定不可用 → 报
#     Compiler for language c for the build machine not found.
#   给了 *_ld 后 meson 用它替代裸名，不再走 PATH 查找。
c_ld = 'D:/ProgramerDevelop/VS2026/SDK/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/link.exe'
cpp_ld = 'D:/ProgramerDevelop/VS2026/SDK/VC/Tools/MSVC/14.51.36231/bin/Hostx64/x64/link.exe'

# pkgconfig：让 meson **不去编译** build machine 那份 glib。
#
# frida-gum/meson.build:404 的 dependency('glib-2.0', native: true) 找不到系统 glib 时，
# 会回退去编译 subprojects/glib 的 build machine 版本，而这条路在本机必崩：
#   meson 1.12 → 'glib:default' is already set as default（同一 subproject 配两台机器）
#   meson 1.4  → build machine 那份注册不上依赖，Dependency 'glib-2.0' is required but not found
# 而那份 glib 我们根本用不上（只用于 meson.build:406 探测本机 glib 是否 Frida fork，
# 答案"不是"→ 探测失败 → 不加 -DHAVE_FRIDA_GLIB=1，正是期望结果）。
#
# 所以这里给一个 pkg-config 替身（build/scripts/fake-pkg-config.py），只认 glib 家族，
# 让 meson 认为"系统里有 glib"，从而只配置 host 一台机器。
# 它不伪造任何编译产物：Cflags/Libs 默认留空，探测失败是可接受的（且是正确的结果）。
# 必须写在一行：meson 的 machine file 用 configparser 解析，**不支持跨行列表**，
# 写成多行会报 "Malformed machine file ... [line N]: ']\n'"。
pkgconfig = ['C:/Users/52334/.workbuddy-ai/binaries/python/envs/default/Scripts/python.exe', 'D:/泪心安卓领域基本盘技术/zygisk_frida_PackerGetPrivateTool/ZygiskAIRuntime/build/scripts/fake-pkg-config.py']
